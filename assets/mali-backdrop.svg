<svg xmlns="http://www.w3.org/2000/svg" viewBox="560 0 1040 700" preserveAspectRatio="xMaxYMax slice">
  <title>Sunset over the Niger River with the silhouette of the Great Mosque of Djenné, Mali (illustration)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".55" stop-color="#f8e3b5"/>
      <stop offset="1" stop-color="#eec27a"/>
    </linearGradient>
    <radialGradient id="sun" cx="1170" cy="400" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset=".5" stop-color="#f6d48f" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f6d48f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c27e"/>
      <stop offset="1" stop-color="#d9a95c"/>
    </linearGradient>
    <linearGradient id="mud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98745"/>
      <stop offset="1" stop-color="#9c6d34"/>
    </linearGradient>
    <g id="toron"><rect x="-2" y="0" width="16" height="3.2" rx="1.2" fill="#8a5d2a"/></g>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <circle cx="1170" cy="400" r="190" fill="url(#sun)"/>
  <circle cx="1170" cy="420" r="58" fill="#fbe7b9"/>
  <!-- distant cliffs / plateau -->
  <path d="M0 500 C180 470 300 485 420 470 C560 452 640 476 760 470 C900 462 1000 480 1120 472 C1260 462 1400 478 1600 462 L1600 560 L0 560Z" fill="#e3b46c" opacity=".55"/>
  <!-- Great Mosque of Djenné silhouette -->
  <g fill="url(#mud)" transform="translate(860 300)">
    <path d="M0 230 L0 150 L40 150 L40 120 L60 120 L60 150 L110 150 L110 95 L118 70 L132 60 L146 70 L154 95 L154 150 L200 150 L200 70 L208 40 L225 26 L242 40 L250 70 L250 150 L296 150 L296 95 L304 70 L318 60 L332 70 L340 95 L340 150 L390 150 L390 120 L410 120 L410 150 L450 150 L450 230 Z"/>
    <!-- rooftop cones -->
    <path d="M118 70 L132 46 L146 70Z M208 40 L225 8 L242 40Z M304 70 L318 46 L332 70Z"/>
    <!-- crenellations -->
    <path d="M0 150 l8-14 8 14 8-14 8 14 8-14 M410 150 l8-14 8 14 8-14 8 14 8-14"/>
    <!-- torons (wooden beams) -->
    <g>
      <use href="#toron" x="112" y="104"/><use href="#toron" x="146" y="104"/><use href="#toron" x="112" y="128"/><use href="#toron" x="146" y="128"/>
      <use href="#toron" x="202" y="70"/><use href="#toron" x="242" y="70"/><use href="#toron" x="202" y="98"/><use href="#toron" x="242" y="98"/><use href="#toron" x="202" y="126"/><use href="#toron" x="242" y="126"/>
      <use href="#toron" x="298" y="104"/><use href="#toron" x="332" y="104"/><use href="#toron" x="298" y="128"/><use href="#toron" x="332" y="128"/>
      <use href="#toron" x="30" y="170"/><use href="#toron" x="90" y="170"/><use href="#toron" x="170" y="170"/><use href="#toron" x="270" y="170"/><use href="#toron" x="350" y="170"/><use href="#toron" x="420" y="170"/>
    </g>
    <!-- doorway -->
    <path d="M210 230 L210 196 Q225 178 240 196 L240 230Z" fill="#7d5226"/>
  </g>
  <!-- palms -->
  <g fill="#8f6430" opacity=".85">
    <path d="M700 530 C706 470 712 440 716 410 L722 410 C718 450 714 490 712 530Z"/>
    <path d="M719 410 C690 395 660 400 640 418 C668 404 694 404 719 414Z M719 410 C744 392 774 394 796 410 C770 400 744 402 720 414Z M719 410 C706 384 686 372 664 372 C690 380 706 394 718 414Z M719 410 C734 382 756 370 780 370 C756 380 736 396 721 414Z"/>
    <path d="M1390 535 C1394 490 1398 465 1402 440 L1407 440 C1404 470 1401 500 1399 535Z"/>
    <path d="M1404 440 C1382 428 1360 432 1344 446 C1366 436 1384 436 1404 444Z M1404 440 C1424 426 1448 428 1464 442 C1444 434 1424 436 1405 444Z M1404 440 C1394 420 1378 410 1360 410 C1380 418 1394 428 1403 444Z"/>
  </g>
  <!-- ground and river -->
  <path d="M0 530 L1600 530 L1600 548 L0 548Z" fill="#c8964f"/>
  <rect y="548" width="1600" height="152" fill="url(#water)"/>
  <g stroke="#fff3d6" stroke-linecap="round" opacity=".7">
    <path d="M1100 575 h140 M1120 600 h100 M1140 625 h60 M1150 648 h40" stroke-width="3"/>
    <path d="M120 590 h80 M380 620 h60 M560 600 h90 M1400 610 h70" stroke-width="2" opacity=".6"/>
  </g>
  <!-- pirogue with fisherman -->
  <g fill="#7d5226">
    <path d="M420 640 C470 652 560 652 610 640 C590 656 450 658 420 640Z"/>
    <path d="M512 640 L514 598 L519 598 L518 640Z"/><circle cx="516" cy="592" r="6"/>
    <path d="M500 612 L556 560" stroke="#7d5226" stroke-width="3"/>
  </g>
</svg>
